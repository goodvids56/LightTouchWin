name: Idea
description: A change to Light Touch for Windows for a device it already runs
labels: [enhancement]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: This fork brings Light Touch to Windows for the devices listed in the [README](https://github.com/goodvids56/LightTouchWin#devices). Requests for the Mac app go to [LightTouchMac](https://github.com/samhenrigold/LightTouchMac).
      options:
        - label: This is for Light Touch on Windows, for a device and iOS version Light Touch supports.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would let you do.
    validations:
      required: true
