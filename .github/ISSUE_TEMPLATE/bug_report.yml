name: Bug report
description: Something doesn't work the way it should in Light Touch for Windows
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Light Touch for Windows version
      description: From Help ▸ About Light Touch for Windows, or the release you downloaded.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Emulated device and iOS version
      description: For example "iPod touch (2nd gen), iOS 3.1.3".
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC and Windows version
      description: For example "ThinkPad X1 Carbon, Windows 11 24H2".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In Light Touch, select the device and choose Device ▸ Show Logs. Attach emulator.log and serial.log.
